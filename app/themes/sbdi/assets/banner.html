<!-- site-banner -->
<header>

  <!-- Banner-->
  <div class="container">
    <div class="banner">
      <a href="https://biodiversitydata.se/" title="Swedish Biodiversity Data Infrastructure">
        <img src="::headerFooterServer::/app/themes/sbdi/assets/images/SBDI-rgb.svg" alt="Swedish Biodiversity Data Infrastructure">
      </a>
      <p data-i18n="general.orgfullname"></p>
      <a class="hidden-xs" href="https://biodiversitydata.se/explore-data/">
        <i class="fas fa-arrow-circle-right"></i>&nbsp;All SBDI tools
      </a>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-default">
    <div class="container">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar-collapse" aria-expanded="false">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
      </div>
      <div id="navbar-collapse" class="collapse navbar-collapse">
        <ul class="nav navbar-nav">
          <li class="dropdown">
            <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">Help <span class="caret"></span></a>
            <ul class="dropdown-menu">
              <li><a href="https://docs.biodiversitydata.se/support">Contact us / Support</a></li>
            </ul>
          </li>
          <li class="dropdown">
            <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">
              <span class="visible-xs-inline visible-sm-inline">User</span>
              <i class="visible-md-inline visible-lg-inline fas fa-user"></i> <span class="caret"></span>
            </a>
            <ul id="user-menu" class="dropdown-menu ::loginStatus::">
              <li><a class="loginBtn" href="::loginURL::">Login</a></li>
              <li><a class="signUpBtn" href="::casURL::/userdetails/registration/createAccount/">Sign up</a></li>
              <li><a class="myProfileBtn" href="::casURL::/userdetails/myprofile/">My profile</a></li>
              <li><a class="logoutBtn" href="::logoutURL::">Logout</a></li>
            </ul>
          </li>
          <li class="visible-xs-inline">
            <a href="https://biodiversitydata.se/explore-data/">All SBDI tools</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<div class="::containerClass::" id="autocompleteSearchALA" class="collapse"></div>

<!-- ALA autocomplete code -->
<script type="text/html" id="autoCompleteTemplate">
      <li class="autocomplete-item striped">
        <div class="content-spacing">
          <div class="autocomplete-heading">
            <% if (commonNameMatches.length > 0) { %>
            <%=commonNameMatches[0]%>
            <% } else if (scientificNameMatches.length > 0) { %>
            <%=scientificNameMatches[0]%>
            <% } else { %>
            <%=matchedNames[0]%>
            <% } %>
          </div>
        </div>
      </li>
    </script>
<!-- end site-banner -->

<!-- maintenance -->
<div id="mante-container" style="display: none;" class="container"></div>
